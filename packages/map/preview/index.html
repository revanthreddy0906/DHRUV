<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DHRUV map preview</title>
    <style>
      :root { color-scheme: light; font-family: system-ui, sans-serif; color: #1f2d3a; background: #f5f7fa; }
      body { margin: 0; padding: 16px; }
      h1 { font-size: 18px; margin: 0 0 4px; }
      p.note { margin: 0 0 12px; font-size: 13px; color: #5b6b7a; }
      .controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 12px; font-size: 13px; }
      .controls button { font: inherit; padding: 6px 10px; border: 1px solid #c3ccd6; border-radius: 6px; background: #fff; cursor: pointer; }
      .controls button[aria-pressed="true"] { background: #1f2d3a; color: #fff; border-color: #1f2d3a; }
      .controls .group { display: flex; gap: 4px; align-items: center; }
      .panes { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
      .pane { background: #fff; border: 1px solid #dde3ea; border-radius: 8px; padding: 8px; min-width: 0; }
      .pane h2 { font-size: 13px; margin: 0 0 6px; color: #5b6b7a; font-weight: 600; }
      #map { height: 520px; border-radius: 4px; }
      #schematic svg { width: 100%; height: auto; display: block; }
      #facts { margin-top: 12px; font-size: 13px; background: #fff; border: 1px solid #dde3ea; border-radius: 8px; padding: 8px 12px; }
      #facts li { margin: 2px 0; }
      @media (max-width: 900px) { .panes { grid-template-columns: 1fr; } }
    </style>
  </head>
  <body>
    <h1>DHRUV map preview</h1>
    <p class="note">Section 10 emergency scenario (FT-3 overdue near Maitri). Synthetic demonstration data. Not operational NCPOR data.</p>
    <div class="controls">
      <div class="group" id="times"><strong>Demo time:</strong></div>
      <div class="group" id="views"><strong>View:</strong></div>
      <div class="group"><strong>SK-2:</strong> <button id="resolve" aria-pressed="false">Resolve conflict as OK</button></div>
    </div>
    <div class="panes">
      <div class="pane"><h2>Leaflet on tiles (switch basemap top-right)</h2><div id="map"></div></div>
      <div class="pane"><h2>Offline schematic (no tiles)</h2><div id="schematic"></div></div>
    </div>
    <ul id="facts"></ul>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
